name: Feature Plugin Validation

on:
  push:
    branches:
      - feature/universal-plugins-awesome
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'gulpfile.mjs'
      - 'webpack.config.cjs'
      - '.github/workflows/feature-plugin-validation.yml'
  pull_request:
    branches:
      - development
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'gulpfile.mjs'
      - 'webpack.config.cjs'
      - '.github/workflows/feature-plugin-validation.yml'

permissions:
  contents: read

jobs:
  webos-modern:
    name: Tests, lint and webOS 6+ package
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run plugin integration and initialization tests
        run: node --test tests/PluginCatalog.test.js tests/PluginExtensionHost.test.js tests/LitefinServerPluginDetection.test.js

      - name: Run ESLint
        run: npm run lint

      - name: Build webOS Modern package (webOS 6.0+)
        run: npm run package:webos-modern

      - name: Upload webOS package
        uses: actions/upload-artifact@v4
        with:
          name: Litefin-webOS-Modern-${{ github.sha }}
          path: Litefin-*-webOS-Modern.ipk
          if-no-files-found: error
          retention-days: 14
